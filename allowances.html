<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telecomax Allowance Audit</title><style>
:root{--bg:#f3f6f8;--card:#fff;--text:#24313a;--muted:#71808b;--line:#dfe6ea;--brand:#c52b83;--green:#21865a;--red:#b83b47;--amber:#a66a00}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:var(--bg);color:var(--text)}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:20px}.brand span{color:var(--brand)}button,input,select,textarea{font:inherit}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--brand);color:#fff}.ghost{background:#eef2f4;color:var(--text)}main{max-width:1250px;margin:auto;padding:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 8px 24px #25323a0b}.login{max-width:440px;margin:70px auto}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;min-width:0}
.combo{position:relative}.combo input{width:100%;padding-right:34px}.combo:after{content:'⌄';position:absolute;right:11px;bottom:11px;color:var(--muted);pointer-events:none}.combo-list{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);max-height:230px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px #25323a20;z-index:30;padding:5px}.combo.open .combo-list{display:block}.combo-option{padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13px}.combo-option.multi{display:flex;align-items:center;gap:8px}.combo-option.multi input{width:auto}.chips{position:absolute;left:0;right:0;top:100%;display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;z-index:6;pointer-events:none}.chips .chip{pointer-events:auto}.chip{background:#f8eaf2;color:var(--brand);border-radius:99px;padding:3px 8px;font-size:11px;font-weight:700}.combo-option:hover,.combo-option.active{background:#f8eaf2;color:var(--brand)}.combo-empty{padding:10px;color:var(--muted);font-size:12px}.filters{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr 1fr auto auto;gap:10px;align-items:end}
.filters>.field{align-self:end}.filters .field>input,.filters .field>select{height:46px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#f8fafb;border:1px solid var(--line);border-radius:14px;padding:15px}.metric b{font-size:22px;display:block;margin-top:5px}.metric small{color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px}.bulkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}.bulkbar .spacer{flex:1}.records{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.audit-table{width:100%;border-collapse:collapse;min-width:1000px}.audit-table th{background:#f4f7f8;text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}.audit-table td{padding:7px 8px;border-bottom:1px solid #edf1f3;vertical-align:middle;font-size:12.5px}.audit-table tr:hover td{background:#fbfcfd}.audit-table tr:last-child td{border-bottom:0}.check{width:17px;height:17px;accent-color:var(--brand)}.name{font-weight:850}.meta{font-size:13px;color:var(--muted);margin-top:4px}.amount{font-size:19px;font-weight:900}.status{font-weight:800}.Pending{color:var(--amber)}.Approved{color:var(--green)}.Rejected{color:var(--red)}.actions{display:flex;gap:6px;flex-wrap:wrap}.approve{background:#e9f7f0;color:var(--green)}.reject{background:#fdecef;color:var(--red)}.pending{background:#fff4db;color:var(--amber)}.empty{text-align:center;color:var(--muted);padding:35px}.toast{position:fixed;right:20px;bottom:20px;background:#26323a;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:20}.note{font-size:13px;color:var(--muted);line-height:1.5}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{background:#edf1f3}.tab.active{background:var(--brand);color:#fff}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:700px){.chips{position:static;margin-top:4px}.filters .field>input,.filters .field>select{height:44px}main{padding:12px}.filters{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.metric{padding:10px}.metric b{font-size:18px}header{padding:12px 14px}.records{border:0;background:transparent;overflow:visible}.audit-table,.audit-table tbody,.audit-table tr,.audit-table td{display:block;width:100%;min-width:0}.audit-table thead{display:none}.audit-table tr{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;padding:6px}.audit-table td{border:0;padding:4px 6px;display:flex;justify-content:space-between;gap:10px}.audit-table td:before{content:attr(data-label);font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}.audit-table td.select-cell{justify-content:flex-start}.audit-table td.select-cell:before{content:'Select'}.actions{justify-content:flex-end}.bulkbar .btn{width:auto}}
</style></head><body><header><div class="brand"><span>TELECOMAX</span> · Allowance Audit</div><button id="logout" class="btn ghost" style="display:none">Logout</button></header><main>
<section id="login" class="card login"><h2>PM Login</h2><p class="note">Use the Allowance PM PIN configured in Code.gs.</p><div class="field"><label>PM PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="Enter PM PIN"></div><br><button id="loginBtn" class="btn primary">Login</button></section>
<section id="app" style="display:none"><div class="card"><div class="section-title"><div><h2 style="margin:0">Monthly Allowance Audit</h2></div></div><br><div class="filters"><div class="field"><label>Month</label><input id="month" type="month"></div><div class="field combo" id="engineerCombo"><label>Engineer</label><input id="engineer" autocomplete="off" placeholder="Search / select Engineers"><div id="engineerChips" class="chips"></div><div id="engineerList" class="combo-list"></div></div><div class="field combo" id="driverCombo"><label>Driver</label><input id="driver" autocomplete="off" placeholder="Search / select Drivers"><div id="driverChips" class="chips"></div><div id="driverList" class="combo-list"></div></div><div class="field combo" id="projectCombo"><label>Project</label><input id="project" autocomplete="off" placeholder="All Projects"><div id="projectList" class="combo-list"></div></div><div class="field"><label>Status</label><select id="status"><option value="">All Statuses</option><option selected>Pending</option><option>Approved</option><option>Rejected</option></select></div><button id="apply" class="btn primary">Apply</button><button id="clear" class="btn ghost">Clear</button></div></div>
<div class="summary"><div class="metric"><small>Calculated</small><b id="calculated">0 EGP</b></div><div class="metric"><small>Approved</small><b id="approved">0 EGP</b></div><div class="metric"><small>Pending</small><b id="pending">0 EGP</b></div><div class="metric"><small>Rejected</small><b id="rejected">0 EGP</b></div></div><br>
<div class="card"><div class="tabs"><button class="btn tab active" data-type="All">All</button><button class="btn tab" data-type="Engineer">Engineers</button><button class="btn tab" data-type="Driver">Drivers</button></div>
<div class="bulkbar"><button id="selectAll" class="btn ghost">Select All</button><button id="clearSelection" class="btn ghost">Clear Selection</button><div class="spacer"></div><span id="selectedCount" class="note">0 selected</span><button id="approveSelected" class="btn primary">Approve Selected</button><button id="exportExcel" class="btn ghost">Export Excel</button></div>
<div id="records" class="records"></div></div>
</section></main><div id="toast" class="toast"></div><script>
const URL='https://script.google.com/macros/s/AKfycbyPpI27VQqpIrZHn8mizmONCLHEbp_aJj_wnan6nyYh-0R2bNW_C7qbYuAHQvRgwS5_fg/exec',$=x=>document.getElementById(x);let pmPin=sessionStorage.getItem('tmx_allowance_pm_pin')||'',data=null,typeView='All';
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}function money(n){return (Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' EGP'}async function post(action,x={}){const r=await fetch(URL,{method:'POST',body:JSON.stringify({action,pmPin,...x})}),d=await r.json();if(!d.ok)throw Error(d.error||'Server error');return d}function auth(on){$('login').style.display=on?'none':'block';$('app').style.display=on?'block':'none';$('logout').style.display=on?'block':'none';if(on)load()}
function monthNow(){let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,7)}$('month').value=monthNow();
$('loginBtn').onclick=async()=>{pmPin=$('pin').value.trim();try{await post('allowanceVerify');sessionStorage.setItem('tmx_allowance_pm_pin',pmPin);auth(true)}catch(e){pmPin='';toast('Wrong PM PIN or connection problem')}};$('pin').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('logout').onclick=()=>{pmPin='';sessionStorage.removeItem('tmx_allowance_pm_pin');auth(false)};
let selectedEngineers=[],selectedDrivers=[];
function uniq(a){return [...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y))}
function eq(a,b){return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase()}
function selectedFor(k){return k==='engineer'?selectedEngineers:k==='driver'?selectedDrivers:[$('project').value.trim()].filter(Boolean)}
function relationalOptions(kind){
 const p=$('project').value.trim(), combos=(data.combos||[]).filter(c=>{
   if(kind!=='engineer'&&selectedEngineers.length&&!selectedEngineers.some(x=>eq(c.engineer,x)))return false;
   if(kind!=='driver'&&selectedDrivers.length&&!selectedDrivers.some(x=>eq(c.driver,x)))return false;
   if(kind!=='project'&&p&&!eq(c.project,p))return false;
   return true;
 });
 if(kind==='engineer')return uniq(combos.map(c=>c.engineer));
 if(kind==='driver')return uniq(combos.map(c=>c.driver).filter(x=>String(x).toLowerCase()!=='rent'));
 return uniq(combos.map(c=>c.project));
}
function drawChips(kind){
 const arr=kind==='engineer'?selectedEngineers:selectedDrivers, el=$(kind+'Chips');
 el.innerHTML=arr.map((x,i)=>`<span class="chip">${x} <b data-kind="${kind}" data-i="${i}" style="cursor:pointer">×</b></span>`).join('');
 el.querySelectorAll('b').forEach(b=>b.onclick=e=>{e.stopPropagation();let a=b.dataset.kind==='engineer'?selectedEngineers:selectedDrivers;a.splice(+b.dataset.i,1);refreshAllCombos()});
}
function renderCombo(kind){
 const input=$(kind),list=$(kind+'List'),q=input.value.trim().toLowerCase(),chosen=selectedFor(kind);
 const options=relationalOptions(kind).filter(x=>!q||x.toLowerCase().includes(q));
 list.innerHTML=options.length?options.map(x=>kind==='project'
 ?`<div class="combo-option" data-value="${x.replace(/"/g,'&quot;')}">${x}</div>`
 :`<div class="combo-option multi" data-value="${x.replace(/"/g,'&quot;')}"><input type="checkbox" ${chosen.some(v=>eq(v,x))?'checked':''}><span>${x}</span></div>`).join(''):'<div class="combo-empty">No matching options</div>';
 list.querySelectorAll('.combo-option').forEach(o=>o.onclick=e=>{
   e.preventDefault();let v=o.dataset.value;
   if(kind==='project'){$('project').value=v;$(kind+'Combo').classList.remove('open')}
   else{let a=kind==='engineer'?selectedEngineers:selectedDrivers,idx=a.findIndex(x=>eq(x,v));if(idx>=0)a.splice(idx,1);else a.push(v);input.value='';drawChips(kind)}
   refreshAllCombos();
 });
}
function refreshAllCombos(){drawChips('engineer');drawChips('driver');['engineer','driver','project'].forEach(renderCombo)}
function setupCombo(kind){
 const input=$(kind),box=$(kind+'Combo');
 input.addEventListener('focus',()=>{if(kind==='project')input.select();box.classList.add('open');renderCombo(kind)});
 input.addEventListener('click',()=>{box.classList.add('open');renderCombo(kind)});
 input.addEventListener('input',()=>{box.classList.add('open');renderCombo(kind)});
 input.addEventListener('keydown',e=>{if(e.key==='Escape'){box.classList.remove('open');input.blur()}});
}
['engineer','driver','project'].forEach(setupCombo);
document.addEventListener('click',e=>{['engineer','driver','project'].forEach(k=>{if(!$(k+'Combo').contains(e.target))$(k+'Combo').classList.remove('open')})});
async function load(){
 try{
   // Fetch broad data for relational options, then filter client-side for multi selections.
   data=await post('allowanceData',{filterMonth:$('month').value,filterEngineer:'',filterDriver:'',filterProject:$('project').value,filterStatus:$('status').value});
   if(selectedEngineers.length)data.records=(data.records||[]).filter(r=>r.type!=='Engineer'||selectedEngineers.some(x=>eq(r.name,x)));
   if(selectedDrivers.length)data.records=(data.records||[]).filter(r=>r.type!=='Driver'||selectedDrivers.some(x=>eq(r.name,x)));
   // For a combined All view, also respect relational trip combinations for each record's projects/relations.
   refreshAllCombos();recalcVisibleSummary();render()
 }catch(e){toast(e.message)}
}
function recalcVisibleSummary(){
 let rows=(data.records||[]).filter(r=>typeView==='All'||r.type===typeView), sm={calculated:0,approved:0,pending:0,rejected:0};
 rows.forEach(r=>{sm.calculated+=Number(r.amount)||0;if(r.status==='Approved')sm.approved+=Number(r.amount)||0;else if(r.status==='Pending')sm.pending+=Number(r.amount)||0;else if(r.status==='Rejected')sm.rejected+=Number(r.amount)||0});
 data.summary=sm;
}
function render(){let sm=data.summary||{};$('calculated').textContent=money(sm.calculated);$('approved').textContent=money(sm.approved);$('pending').textContent=money(sm.pending);$('rejected').textContent=money(sm.rejected);let rows=(data.records||[]).filter(r=>typeView==='All'||r.type===typeView);let body=rows.map(r=>{let key=encodeURIComponent(JSON.stringify({type:r.type,name:r.name,date:r.date,amount:r.amount})),pending=r.status==='Pending';return `<tr><td class="select-cell" data-label="Select">${pending?`<input class="check rowCheck" type="checkbox" data-key="${key}">`:''}</td><td data-label="Person"><b>${r.type}</b> · ${r.name}</td><td data-label="Date">${r.date}<div class="meta">${r.day}</div></td><td data-label="Area"><b>${r.area}</b><div class="meta">Base: ${r.baseCity||'Not set'}</div></td><td data-label="Project">${r.projects.join(', ')||'—'}</td><td data-label="Details">${r.type==='Engineer'?`Working days: <b>${r.workingDays}</b>`:`Related: ${r.related.join(', ')||'—'}`}</td><td data-label="Allowance"><b>${money(r.amount)}</b></td><td data-label="Status"><span class="status ${r.status}">${r.status}</span></td><td data-label="Action"><div class="actions">${pending?`<button class="btn reject" onclick="rejectDay('${r.type}','${esc(r.name)}','${r.date}',${r.amount})">Reject</button>`:''}</div></td></tr>`}).join('');$('records').innerHTML=rows.length?`<table class="audit-table"><thead><tr><th></th><th>Person</th><th>Date</th><th>Area</th><th>Project</th><th>Details</th><th>Allowance</th><th>Status</th><th>Action</th></tr></thead><tbody>${body}</tbody></table>`:'<div class="empty">No pending allowance records match these filters.</div>';document.querySelectorAll('.rowCheck').forEach(x=>x.addEventListener('change',updateSelectedCount));updateSelectedCount()}
function selectedRecords(){return [...document.querySelectorAll('.rowCheck:checked')].map(x=>JSON.parse(decodeURIComponent(x.dataset.key)))}
function updateSelectedCount(){$('selectedCount').textContent=`${selectedRecords().length} selected`}
$('selectAll').onclick=()=>{document.querySelectorAll('.rowCheck').forEach(x=>x.checked=true);updateSelectedCount()};
$('clearSelection').onclick=()=>{document.querySelectorAll('.rowCheck').forEach(x=>x.checked=false);updateSelectedCount()};
$('approveSelected').onclick=async()=>{let items=selectedRecords();if(!items.length){toast('Select at least one pending day.');return}if(!confirm(`Approve ${items.length} selected allowance day(s)?`))return;let b=$('approveSelected');b.disabled=true;b.textContent='Approving...';try{for(const r of items)await post('allowanceAudit',{type:r.type,name:r.name,date:r.date,calculatedAmount:r.amount,status:'Approved',reason:''});toast(`${items.length} day(s) approved.`);await load()}catch(e){toast(e.message)}finally{b.disabled=false;b.textContent='Approve Selected'}}
function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
async function audit(type,name,date,amount,status,reason=''){try{await post('allowanceAudit',{type,name,date,calculatedAmount:amount,status,reason});await load()}catch(e){toast(e.message)}}function rejectDay(type,name,date,amount){let reason=prompt('Reason for rejection (optional):','');if(reason===null)return;audit(type,name,date,amount,'Rejected',reason)}
$('exportExcel').onclick=()=>{
 try{
  const rows=(data.records||[]).filter(r=>(typeView==='All'||r.type===typeView)&&r.status==='Approved');
  if(!rows.length){toast('No approved allowances to export for the current filters.');return}
  const escx=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const groups={};
  rows.forEach(r=>(r.projects&&r.projects.length?r.projects:['—']).forEach(pr=>{
    const k=r.type+'|'+r.name+'|'+pr;
    if(!groups[k])groups[k]={name:r.name,project:pr,total:0};
    groups[k].total+=Number(r.amount)||0;
  }));
  const cover=Object.values(groups);
  const row=a=>'<tr>'+a.map(v=>'<td>'+escx(v)+'</td>').join('')+'</tr>';
  const details=rows.flatMap(r=>(r.projects&&r.projects.length?r.projects:['—']).map(pr=>[
    r.type,r.name,r.date,r.day,r.area,r.baseCity||'',pr,Number(r.amount)||0,r.status
  ]));
  const html=`<!doctype html><html><head><meta charset="utf-8"><style>
    table{border-collapse:collapse;margin-bottom:28px}th,td{border:1px solid #999;padding:7px 10px}th{background:#eee;font-weight:bold}caption{text-align:left;font-size:18px;font-weight:bold;margin:8px 0}
  </style></head><body>
  <table><caption>Cover</caption><thead><tr><th>Name</th><th>Total Allowances Amount</th><th>Project Code</th></tr></thead><tbody>${cover.map(x=>row([x.name,x.total,x.project])).join('')}</tbody></table>
  <table><caption>In Details</caption><thead><tr><th>Type</th><th>Name</th><th>Date</th><th>Day</th><th>Area</th><th>Base City</th><th>Project Code</th><th>Allowance Amount</th><th>Status</th></tr></thead><tbody>${details.map(row).join('')}</tbody></table>
  </body></html>`;
  const a=document.createElement('a');
  const excelData='data:application/vnd.ms-excel;charset=utf-8,'+encodeURIComponent('\ufeff'+html);
  a.href=excelData;
  a.download=`Allowance-Audit-${$('month').value||'All'}-${typeView}.xls`;
  a.style.display='none';document.body.appendChild(a);a.click();a.remove();
  toast('Excel export created.');
 }catch(err){console.error(err);toast('Excel export failed: '+(err.message||err))}
};
$('apply').onclick=load;$('clear').onclick=()=>{selectedEngineers=[];selectedDrivers=[];$('engineer').value='';$('driver').value='';$('project').value='';$('status').value='Pending';refreshAllCombos();load()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');typeView=b.dataset.type;render()});
if(pmPin)post('allowanceVerify').then(()=>auth(true)).catch(()=>{sessionStorage.removeItem('tmx_allowance_pm_pin');pmPin='';auth(false)});else auth(false);
</script></body></html>
