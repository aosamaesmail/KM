<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telecomax Finance Audit Portal</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0c0c0f;--panel:#151519;--panel2:#1d1d23;--line:#32323b;--text:#f8f8fa;--muted:#9b9ba5;--brand:#cf3691;--brand2:#ef75bb;--good:#42d17d;--warn:#f3b84b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif}.shell{min-height:100vh}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;background:rgba(12,12,15,.96);z-index:10}.brand{font-weight:850;font-size:22px;letter-spacing:.3px}.brand:before{content:"";display:inline-block;width:6px;height:24px;background:var(--brand);margin-right:12px;vertical-align:-5px}.brand small{font-weight:500;color:var(--muted);font-size:14px;margin-left:10px}.top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.btn:hover{border-color:var(--brand)}.btn.primary{background:var(--brand);border-color:var(--brand)}.btn.logout{background:#261620;border-color:#703052;color:#ff9bd1}.wrap{max-width:1540px;margin:auto;padding:26px}.login{max-width:440px;margin:90px auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}.login h1{margin:0 0 6px;font-size:24px}.muted{color:var(--muted)}label{display:block;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;margin:14px 0 7px}.input{width:100%;height:44px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:0 12px;outline:none}.input:focus{border-color:var(--brand)}.dashboard{display:none}.heading{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}.heading h1{font-size:26px;margin:0}.filters{display:grid;grid-template-columns:minmax(210px,1fr) minmax(210px,1fr) 190px auto;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;align-items:end}.field label{margin:0 0 7px}.search{position:relative}.opts{display:none;position:absolute;top:48px;left:0;right:0;max-height:260px;overflow:auto;background:#202027;border:1px solid var(--line);border-radius:10px;z-index:20;box-shadow:0 12px 30px #0008}.opt{padding:10px 12px;cursor:pointer}.opt:hover{background:#30212b;color:#fff}.filter-buttons{display:flex;gap:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.stat .k{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase}.stat .v{font-size:24px;font-weight:850;margin-top:4px}.stat.accent .v{color:var(--brand2)}.audit-head{display:flex;align-items:center;margin:22px 0 10px}.audit-head h2{margin:0;font-size:19px}.audit-head .right{margin-left:auto;display:flex;gap:8px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:1900px}th{position:sticky;top:0;background:#1b1b20;color:var(--muted);font-size:11px;text-transform:uppercase;text-align:left;padding:11px;border-bottom:1px solid var(--line);z-index:2}td{padding:12px 11px;border-bottom:1px solid #28282f;vertical-align:top}tr:hover td{background:#18181d}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#203529;color:#82e7a8;font-size:11px;font-weight:800}.badge.open{background:#3b301a;color:#ffd479}.km{font-weight:800}.amount{font-weight:850;color:var(--brand2);white-space:nowrap}.photos{display:flex;gap:8px}.thumb{width:320px;height:240px;object-fit:contain;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;background:#09090b;display:block}.gps{font-size:12px;color:var(--muted);margin-top:7px;max-width:320px;word-break:break-word}.photo-cell{min-width:344px}.empty{text-align:center;color:var(--muted);padding:55px}.count{color:var(--muted);margin-left:8px}.lightbox{display:none;position:fixed;inset:0;background:#000d;z-index:100;align-items:center;justify-content:center;padding:30px}.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:90vh;border-radius:12px}.lightbox button{position:absolute;top:20px;right:24px}.toast{position:fixed;right:22px;bottom:22px;background:#26262d;border:1px solid var(--line);padding:12px 16px;border-radius:10px;display:none;z-index:120}.hide-photos .photo-cell{display:none}.hide-photos .photo-head{display:none}@media(max-width:900px){.filters{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.wrap{padding:16px}.brand small{display:none}}
</style>
</head>
<body>
<div class="shell"><header class="topbar"><div class="brand">TELECOMAX <small>Finance Audit Portal</small></div><div class="top-actions"><span id="sessionLabel" class="muted"></span><button id="logoutBtn" class="btn logout" style="display:none">Log out</button></div></header>
<main class="wrap">
<section id="loginView" class="login"><h1>Finance Login</h1><div class="muted">Use the Finance PIN. No engineer token is required.</div><label>Finance PIN</label><input id="pin" class="input" type="password" inputmode="numeric" placeholder="Enter Finance PIN"><button id="loginBtn" class="btn primary" style="width:100%;margin-top:16px">Login to Finance</button></section>
<section id="dash" class="dashboard"><div class="heading"><div><h1>Photo Audit</h1><div class="muted">Desktop workspace for reviewing trip odometers, large photos and GPS.</div></div></div>
<div class="filters"><div class="field"><label>Engineer</label><div class="search"><input id="engineer" class="input" autocomplete="off" placeholder="Search or select engineer"><div id="engineerOpts" class="opts"></div></div></div><div class="field"><label>Driver</label><div class="search"><input id="driver" class="input" autocomplete="off" placeholder="Search or select driver"><div id="driverOpts" class="opts"></div></div></div><div class="field"><label>Month</label><input id="month" class="input" type="month"></div><div class="filter-buttons"><button id="apply" class="btn primary">Apply Filters</button><button id="clear" class="btn">Clear</button></div></div>
<div class="stats"><div class="stat"><div class="k">Trips found</div><div id="tripCount" class="v">0</div></div><div class="stat"><div class="k">Trip KM</div><div id="tripKm" class="v">0</div></div><div class="stat"><div class="k">Total KM</div><div id="totalKm" class="v">0</div></div><div class="stat accent"><div class="k">Amount Spent</div><div id="amount" class="v">0.00 EGP</div></div></div>
<div class="audit-head"><h2>Audit Records <span id="matched" class="count"></span></h2><div class="right"><button id="photosBtn" class="btn">Hide Photos</button><button id="refreshBtn" class="btn">Refresh</button></div></div>
<div id="tableWrap" class="table-wrap"><div class="empty">Apply filters or refresh to load trips.</div></div></section>
</main></div>
<div id="lightbox" class="lightbox"><button id="closeLightbox" class="btn">Close</button><img id="lightboxImg" alt="Odometer photo"></div><div id="toast" class="toast"></div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyPpI27VQqpIrZHn8mizmONCLHEbp_aJj_wnan6nyYh-0R2bNW_C7qbYuAHQvRgwS5_fg/exec';
const $=id=>document.getElementById(id); let financePin=sessionStorage.getItem('telecomax_finance_portal_pin')||''; let trips=[]; let lists={engineers:[],drivers:[]}; let photosVisible=localStorage.getItem('finance_portal_photos')!=='0';
function toast(s){const e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>e.style.display='none',2600)}
async function post(action,extra={}){const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action,financePin,...extra})});const text=await r.text();let d;try{d=JSON.parse(text)}catch(e){throw Error('bad-response')}if(!d.ok)throw Error(d.error||'server-error');return d}
async function loadLists(){try{const r=await fetch(SCRIPT_URL+'?action=config');lists=await r.json();wireSearch('engineer','engineerOpts',lists.engineers||[]);wireSearch('driver','driverOpts',lists.drivers||[])}catch(e){}}
function wireSearch(inputId,optsId,arr){const inp=$(inputId),box=$(optsId);function draw(){const q=inp.value.trim().toLowerCase();const vals=arr.filter(x=>!q||String(x).toLowerCase().includes(q)).slice(0,80);box.innerHTML=vals.map(x=>`<div class="opt" data-v="${esc(x)}">${esc(x)}</div>`).join('')||'<div class="opt muted">No matches</div>';box.style.display='block'}inp.addEventListener('focus',draw);inp.addEventListener('input',draw);box.addEventListener('mousedown',e=>{const o=e.target.closest('[data-v]');if(!o)return;inp.value=o.dataset.v;box.style.display='none'});document.addEventListener('click',e=>{if(!e.target.closest('#'+inputId)&&!e.target.closest('#'+optsId))box.style.display='none'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function setAuthed(on){$('loginView').style.display=on?'none':'block';$('dash').style.display=on?'block':'none';$('logoutBtn').style.display=on?'inline-block':'none';$('sessionLabel').textContent=on?'Finance':' ';if(on){loadLists();loadTrips()}}
$('loginBtn').onclick=async()=>{const p=$('pin').value.trim();if(!p)return toast('Enter the Finance PIN');financePin=p;$('loginBtn').disabled=true;try{await post('financeVerify');sessionStorage.setItem('telecomax_finance_portal_pin',p);setAuthed(true);toast('Logged in as Finance')}catch(e){financePin='';toast(e.message==='invalid-finance-pin'?'Wrong Finance PIN':'Could not verify — check connection')}finally{$('loginBtn').disabled=false}};
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('logoutBtn').onclick=()=>{financePin='';sessionStorage.removeItem('telecomax_finance_portal_pin');$('pin').value='';setAuthed(false)};
async function loadTrips(){if(!financePin)return;$('tableWrap').innerHTML='<div class="empty">Loading audit records…</div>';try{const d=await post('financeTrips',{filterEngineer:$('engineer').value.trim(),filterDriver:$('driver').value.trim(),filterMonth:$('month').value});trips=d.trips||[];render(d.totalMatched??trips.length)}catch(e){if(e.message==='invalid-finance-pin'){financePin='';sessionStorage.removeItem('telecomax_finance_portal_pin');setAuthed(false)}else $('tableWrap').innerHTML='<div class="empty">Could not load trips — check connection.</div>'}}
function render(totalMatched){$('tripCount').textContent=trips.length;$('tripKm').textContent=trips.reduce((a,t)=>a+num(t.tripKm),0).toFixed(0);$('totalKm').textContent=trips.reduce((a,t)=>a+num(t.totalKm),0).toFixed(0);$('amount').textContent=trips.reduce((a,t)=>a+num(t.amountSpent),0).toFixed(2)+' EGP';$('matched').textContent=totalMatched>trips.length?`(${trips.length} of ${totalMatched})`:`(${trips.length})`;if(!trips.length){$('tableWrap').innerHTML='<div class="empty">No trips match these filters.</div>';return}const rows=trips.map(t=>`<tr><td>${esc(t.date)}<br><span class="muted">${esc(t.day||'')}</span></td><td><b>${esc(t.engineer)}</b></td><td>${esc(t.driver||'—')}</td><td>${esc(t.projectName||'—')}</td><td>${esc(t.area||'—')}<br><span class="muted">${esc(t.task||'—')}</span></td><td><span class="badge ${t.status==='Completed'?'':'open'}">${esc(t.status||'—')}</span></td><td class="km">${esc(t.startKm||'—')} → ${esc(t.finishKm||'—')}</td><td>${num(t.tripKm).toFixed(0)}</td><td>${num(t.forthBack).toFixed(0)}</td><td>${num(t.totalKm).toFixed(0)}</td><td class="amount">${num(t.amountSpent).toFixed(2)} EGP</td><td class="photo-cell">${photo(t.startPhotoThumb,t.startPhoto,t.startLatitude,t.startLongitude,'Start')}</td><td class="photo-cell">${photo(t.finishPhotoThumb,t.finishPhoto,t.finishLatitude,t.finishLongitude,'Finish')}</td></tr>`).join('');$('tableWrap').innerHTML=`<table><thead><tr><th>Date</th><th>Engineer</th><th>Driver</th><th>Project</th><th>Area / Task</th><th>Status</th><th>Odometer</th><th>Trip KM</th><th>F&B</th><th>Total KM</th><th>Amount</th><th class="photo-head">Start Photo</th><th class="photo-head">Finish Photo</th></tr></thead><tbody>${rows}</tbody></table>`;applyPhotos()}
function photo(thumb,full,lat,lng,label){if(!thumb)return '<span class="muted">No photo</span>';return `<div class="photos"><img class="thumb" src="${esc(thumb)}" data-full="${esc(full||thumb)}" alt="${label} photo"></div><div class="gps">GPS: ${lat!==''&&lng!==''?esc(lat)+', '+esc(lng):'—'}</div>`}
$('tableWrap').addEventListener('click',e=>{const i=e.target.closest('.thumb');if(!i)return;$('lightboxImg').src=i.dataset.full||i.src;$('lightbox').classList.add('open')});$('closeLightbox').onclick=()=>$('lightbox').classList.remove('open');$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').classList.remove('open')};
function applyPhotos(){$('tableWrap').classList.toggle('hide-photos',!photosVisible);$('photosBtn').textContent=photosVisible?'Hide Photos':'Show Photos'}$('photosBtn').onclick=()=>{photosVisible=!photosVisible;localStorage.setItem('finance_portal_photos',photosVisible?'1':'0');applyPhotos()};$('apply').onclick=loadTrips;$('refreshBtn').onclick=loadTrips;$('clear').onclick=()=>{$('engineer').value='';$('driver').value='';$('month').value='';loadTrips()};
(async()=>{if(financePin){try{await post('financeVerify');setAuthed(true)}catch(e){financePin='';sessionStorage.removeItem('telecomax_finance_portal_pin');setAuthed(false)}}else setAuthed(false)})();
</script></body></html>
