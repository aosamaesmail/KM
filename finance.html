<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telecomax Finance Audit Portal</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--panel:#ffffff;--panel2:#f8fafc;--line:#d9dee7;--text:#243042;--muted:#6f7b8c;--brand:#b52d7b;--brand2:#c83a8b;--brand-soft:#f8eaf2;--good:#2f855a;--good-soft:#e8f5ed;--warn:#a66b18;--warn-soft:#fff5df;--shadow:0 4px 16px rgba(31,45,61,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif}.shell{min-height:100vh}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);z-index:10;box-shadow:0 1px 8px rgba(31,45,61,.04)}.brand{font-weight:850;font-size:22px;letter-spacing:.3px;color:#202b3a}.brand:before{content:"";display:inline-block;width:6px;height:24px;background:var(--brand);margin-right:12px;vertical-align:-5px;border-radius:4px}.brand small{font-weight:500;color:var(--muted);font-size:14px;margin-left:10px}.top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:#fff;color:#344054;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:750;box-shadow:0 1px 2px rgba(31,45,61,.03);transition:.15s ease}.btn:hover{border-color:#c7a1b8;background:#fffafd}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:#a52670}.btn.logout{background:var(--brand-soft);border-color:#e7bdd4;color:#9c286a}.wrap{max-width:1540px;margin:auto;padding:26px}.login{max-width:440px;margin:90px auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}.login h1{margin:0 0 6px;font-size:24px}.muted{color:var(--muted)}label{display:block;color:#697586;font-size:12px;font-weight:800;text-transform:uppercase;margin:14px 0 7px}.input{width:100%;height:44px;background:#fff;border:1px solid #ccd3dd;color:var(--text);border-radius:10px;padding:0 12px;outline:none;transition:.15s ease}.input:hover{border-color:#b8c0cc}.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(181,45,123,.10)}.input::placeholder{color:#98a2b3}.dashboard{display:none}.heading{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}.heading h1{font-size:26px;margin:0;color:#202b3a}.filters{display:grid;grid-template-columns:minmax(190px,1fr) minmax(190px,1fr) minmax(170px,.8fr) 180px auto;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;align-items:end;box-shadow:var(--shadow)}.field label{margin:0 0 7px}.search{position:relative}.opts{display:none;position:absolute;top:48px;left:0;right:0;max-height:260px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;z-index:20;box-shadow:0 12px 30px rgba(31,45,61,.14)}.opt{padding:10px 12px;cursor:pointer;color:var(--text)}.opt:hover{background:var(--brand-soft);color:#812157}.filter-buttons{display:flex;gap:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.stat .k{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase}.stat .v{font-size:24px;font-weight:850;margin-top:4px;color:#26364a}.stat.accent{border-color:#ebcade;background:#fffafd}.stat.accent .v{color:var(--brand2)}.audit-head{display:flex;align-items:center;margin:22px 0 10px}.audit-head h2{margin:0;font-size:19px;color:#202b3a}.audit-head .right{margin-left:auto;display:flex;gap:8px}.table-wrap{background:transparent}.audit-list{display:flex;flex-direction:column;gap:20px}.audit-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}.audit-card:hover{border-color:#c7ced8;box-shadow:0 7px 20px rgba(31,45,61,.07)}.trip-summary{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:0;border-bottom:1px solid var(--line);background:#fff}.summary-item{padding:13px 15px;border-right:1px solid #e7eaf0;min-height:72px}.summary-item:last-child{border-right:0}.summary-label{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;margin-bottom:5px}.summary-value{font-size:14px;font-weight:700;word-break:break-word;color:#26364a}.trip-metrics{display:grid;grid-template-columns:repeat(6,1fr);background:#f8fafc;border-bottom:1px solid var(--line)}.metric{padding:12px 15px;text-align:center;border-right:1px solid #e3e7ed}.metric:last-child{border-right:0}.metric .k{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}.metric .v{font-size:16px;font-weight:850;margin-top:4px;color:#26364a}.metric.amount .v{color:var(--brand2)}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:var(--good-soft);color:var(--good);font-size:11px;font-weight:800}.badge.open{background:var(--warn-soft);color:var(--warn)}.photo-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;padding:26px;background:#fbfcfd;align-items:start}.photo-panel{text-align:center;min-width:0}.photo-title{font-size:13px;font-weight:850;text-transform:uppercase;color:#7b4865;margin-bottom:10px;letter-spacing:.2px}.photo-frame{width:100%;height:440px;display:flex;align-items:center;justify-content:center;background:#eef1f5;border:1px solid #d7dce4;border-radius:14px;overflow:hidden}.audit-photo{width:100%;height:100%;object-fit:contain;cursor:zoom-in;display:block}.photo-missing{color:var(--muted);font-size:14px}.gps{font-size:12px;color:var(--muted);margin-top:9px;word-break:break-word;text-align:center}.empty{text-align:center;color:var(--muted);padding:55px;border:1px solid var(--line);border-radius:15px;background:var(--panel);box-shadow:var(--shadow)}.count{color:var(--muted);margin-left:8px}.lightbox{display:none;position:fixed;inset:0;background:rgba(22,28,36,.88);z-index:100;align-items:center;justify-content:center;padding:30px}.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:90vh;border-radius:12px;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.28)}.lightbox button{position:absolute;top:20px;right:24px}.toast{position:fixed;right:22px;bottom:22px;background:#273142;color:#fff;border:1px solid #39475c;padding:12px 16px;border-radius:10px;display:none;z-index:120;box-shadow:0 8px 24px rgba(31,45,61,.18)}.hide-photos .photo-pair{display:none}@media(max-width:1100px){.trip-summary{grid-template-columns:repeat(3,1fr)}.trip-metrics{grid-template-columns:repeat(3,1fr)}.photo-frame{height:360px}}@media(max-width:900px){.filters{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.wrap{padding:16px}.brand small{display:none}.photo-pair{grid-template-columns:1fr}.photo-frame{height:420px}}@media(max-width:600px){.trip-summary,.trip-metrics{grid-template-columns:1fr 1fr}.photo-frame{height:320px}}
</style>
</head>
<body>
<div class="shell"><header class="topbar"><div class="brand">TELECOMAX <small>Finance Audit Portal</small></div><div class="top-actions"><span id="sessionLabel" class="muted"></span><button id="logoutBtn" class="btn logout" style="display:none">Log out</button></div></header>
<main class="wrap">
<section id="loginView" class="login"><h1>Finance Login</h1><div class="muted">Use your management Name + 6-digit PIN.</div><label>Name</label><input id="name" class="input" autocomplete="username" placeholder="Enter your name"><label>PIN</label><input id="pin" class="input" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="6-digit PIN"><button id="loginBtn" class="btn primary" style="width:100%;margin-top:16px">Login to Finance</button></section>
<section id="dash" class="dashboard"><div class="heading"><div><h1>Photo Audit</h1><div class="muted">Desktop workspace for reviewing trip odometers, large photos and GPS.</div></div></div>
<div class="filters"><div class="field"><label>Engineer</label><div class="search"><input id="engineer" class="input" autocomplete="off" placeholder="Search or select engineer"><div id="engineerOpts" class="opts"></div></div></div><div class="field"><label>Driver</label><div class="search"><input id="driver" class="input" autocomplete="off" placeholder="Search or select driver"><div id="driverOpts" class="opts"></div></div></div><div class="field"><label>Project</label><div class="search"><input id="project" class="input" autocomplete="off" placeholder="Search or select project"><div id="projectOpts" class="opts"></div></div></div><div class="field"><label>Month</label><input id="month" class="input" type="month"></div><div class="filter-buttons"><button id="apply" class="btn primary">Apply Filters</button><button id="clear" class="btn">Clear</button></div></div>
<div class="stats"><div class="stat"><div class="k">Trips found</div><div id="tripCount" class="v">0</div></div><div class="stat"><div class="k">Trip KM</div><div id="tripKm" class="v">0</div></div><div class="stat"><div class="k">Total KM</div><div id="totalKm" class="v">0</div></div><div class="stat accent"><div class="k">Amount Spent</div><div id="amount" class="v">0.00 EGP</div></div></div>
<div class="audit-head"><h2>Audit Records <span id="matched" class="count"></span></h2><div class="right"><button id="photosBtn" class="btn">Hide Photos</button><button id="refreshBtn" class="btn">Refresh</button></div></div>
<div id="tableWrap" class="table-wrap"><div class="empty">Apply filters or refresh to load trips.</div></div></section>
</main></div>
<div id="lightbox" class="lightbox"><button id="closeLightbox" class="btn">Close</button><img id="lightboxImg" alt="Odometer photo"></div><div id="toast" class="toast"></div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyPpI27VQqpIrZHn8mizmONCLHEbp_aJj_wnan6nyYh-0R2bNW_C7qbYuAHQvRgwS5_fg/exec';
const $=id=>document.getElementById(id); let managementToken=sessionStorage.getItem('tmx_km_finance_token')||'', managementName=sessionStorage.getItem('tmx_km_finance_name')||''; let trips=[]; let filterCombos=[]; let photosVisible=localStorage.getItem('finance_portal_photos')!=='0';
function toast(s){const e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>e.style.display='none',2600)}
async function post(action,extra={}){const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action,managementToken,...extra})});const text=await r.text();let d;try{d=JSON.parse(text)}catch(e){throw Error('bad-response')}if(!d.ok)throw Error(d.error||'server-error');return d}
function uniqueSorted(values){return [...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)))}
function currentRelatedOptions(kind){
  const eng=$('engineer').value.trim().toLowerCase(), drv=$('driver').value.trim().toLowerCase(), prj=$('project').value.trim().toLowerCase();
  const rows=filterCombos.filter(r=>{
    if(kind!=='engineer' && eng && String(r.engineer).toLowerCase()!==eng)return false;
    if(kind!=='driver' && drv && String(r.driver).toLowerCase()!==drv)return false;
    if(kind!=='project' && prj && String(r.project).toLowerCase()!==prj)return false;
    return true;
  });
  return uniqueSorted(rows.map(r=>r[kind]));
}
function drawOptions(inputId,optsId){
  const inp=$(inputId),box=$(optsId),q=inp.value.trim().toLowerCase();
  const vals=currentRelatedOptions(inputId).filter(x=>!q||String(x).toLowerCase().includes(q)).slice(0,100);
  box.innerHTML=vals.map(x=>`<div class="opt" data-v="${esc(x)}">${esc(x)}</div>`).join('')||'<div class="opt muted">No related matches</div>';box.style.display='block';
}
function wireRelatedSearch(inputId,optsId){
  const inp=$(inputId),box=$(optsId);
  inp.addEventListener('focus',()=>drawOptions(inputId,optsId)); inp.addEventListener('input',()=>drawOptions(inputId,optsId));
  box.addEventListener('mousedown',e=>{const o=e.target.closest('[data-v]');if(!o)return;inp.value=o.dataset.v;box.style.display='none';sanitizeRelatedFilters(inputId)});
  document.addEventListener('click',e=>{if(!e.target.closest('#'+inputId)&&!e.target.closest('#'+optsId))box.style.display='none'});
}
function sanitizeRelatedFilters(changed){
  const ids=['engineer','driver','project'];
  ids.filter(id=>id!==changed).forEach(id=>{const val=$(id).value.trim();if(!val)return;const allowed=currentRelatedOptions(id).map(x=>String(x).toLowerCase());if(!allowed.includes(val.toLowerCase()))$(id).value=''});
}
async function loadLists(){try{const d=await post('financeFilterOptions');filterCombos=d.combinations||[];['engineer','driver','project'].forEach(id=>wireRelatedSearch(id,id+'Opts'))}catch(e){toast('Could not load filter lists')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function setAuthed(on){$('loginView').style.display=on?'none':'block';$('dash').style.display=on?'block':'none';$('logoutBtn').style.display=on?'inline-block':'none';$('sessionLabel').textContent=on?'Finance':' ';if(on){loadLists();loadTrips()}}
$('loginBtn').onclick=async()=>{const name=$('name').value.trim(),pin=$('pin').value.trim();if(!name||!pin)return toast('Enter your name and 6-digit PIN');$('loginBtn').disabled=true;try{const d=await post('managementLogin',{name,pin,portalRole:'Finance'});managementToken=d.token;managementName=d.name||name;sessionStorage.setItem('tmx_km_finance_token',managementToken);sessionStorage.setItem('tmx_km_finance_name',managementName);setAuthed(true);toast('Logged in as '+managementName)}catch(e){managementToken='';toast(e.message||'Could not verify — check connection')}finally{$('loginBtn').disabled=false}};
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')$('pin').focus()});
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('logoutBtn').onclick=()=>{managementToken='';managementName='';sessionStorage.removeItem('tmx_km_finance_token');sessionStorage.removeItem('tmx_km_finance_name');$('name').value='';$('pin').value='';setAuthed(false)};
async function loadTrips(){if(!managementToken)return;$('tableWrap').innerHTML='<div class="empty">Loading audit records…</div>';try{const d=await post('financeTrips',{filterEngineer:$('engineer').value.trim(),filterDriver:$('driver').value.trim(),filterProject:$('project').value.trim(),filterMonth:$('month').value});trips=d.trips||[];render(d.totalMatched??trips.length)}catch(e){if(e.message==='finance-session-required'){managementToken='';managementName='';sessionStorage.removeItem('tmx_km_finance_token');sessionStorage.removeItem('tmx_km_finance_name');setAuthed(false)}else $('tableWrap').innerHTML='<div class="empty">Could not load trips — check connection.</div>'}}
function render(totalMatched){
  $('tripCount').textContent=trips.length;
  $('tripKm').textContent=trips.reduce((a,t)=>a+num(t.tripKm),0).toFixed(0);
  $('totalKm').textContent=trips.reduce((a,t)=>a+num(t.totalKm),0).toFixed(0);
  $('amount').textContent=trips.reduce((a,t)=>a+num(t.amountSpent),0).toFixed(2)+' EGP';
  $('matched').textContent=totalMatched>trips.length?`(${trips.length} of ${totalMatched})`:`(${trips.length})`;
  if(!trips.length){$('tableWrap').innerHTML='<div class="empty">No trips match these filters.</div>';return}
  const cards=trips.map(t=>`<article class="audit-card">
    <div class="trip-summary">
      ${summary('Date',esc(t.date)+(t.day?'<br><span class="muted">'+esc(t.day)+'</span>':''))}
      ${summary('Engineer',esc(t.engineer||'—'))}
      ${summary('Driver',esc(t.driver||'—'))}
      ${summary('Project',esc(t.projectName||'—'))}
      ${summary('Area / Task',esc(t.area||'—')+'<br><span class="muted">'+esc(t.task||'—')+'</span>')}
      ${summary('Status','<span class="badge '+(t.status==='Completed'?'':'open')+'">'+esc(t.status||'—')+'</span>')}
    </div>
    <div class="trip-metrics">
      ${metric('Odometer',esc(t.startKm||'—')+' → '+esc(t.finishKm||'—'))}
      ${metric('Trip KM',num(t.tripKm).toFixed(0))}
      ${metric('F&B',num(t.forthBack).toFixed(0))}
      ${metric('Total KM',num(t.totalKm).toFixed(0))}
      ${metric('Amount Spent',num(t.amountSpent).toFixed(2)+' EGP','amount')}
      ${metric('Driver',esc(t.driver||'—'))}
    </div>
    <div class="photo-pair">
      ${photoPanel(t.startPhotoThumb,t.startPhoto,t.startLatitude,t.startLongitude,'Start Photo')}
      ${photoPanel(t.finishPhotoThumb,t.finishPhoto,t.finishLatitude,t.finishLongitude,'Finish Photo')}
    </div>
  </article>`).join('');
  $('tableWrap').innerHTML='<div class="audit-list">'+cards+'</div>';
  applyPhotos();
}
function summary(label,value){return `<div class="summary-item"><div class="summary-label">${label}</div><div class="summary-value">${value}</div></div>`}
function metric(label,value,cls=''){return `<div class="metric ${cls}"><div class="k">${label}</div><div class="v">${value}</div></div>`}
function photoPanel(thumb,full,lat,lng,label){
  const src=thumb||full||'';
  const fullSrc=full||thumb||'';
  const media=src?`<img class="audit-photo" src="${esc(src)}" data-full="${esc(fullSrc)}" alt="${esc(label)}">`:'<div class="photo-missing">No photo available</div>';
  return `<section class="photo-panel"><div class="photo-title">${esc(label)}</div><div class="photo-frame">${media}</div><div class="gps">GPS: ${lat!==''&&lat!=null&&lng!==''&&lng!=null?esc(lat)+', '+esc(lng):'—'}</div></section>`;
}
$('tableWrap').addEventListener('click',e=>{const i=e.target.closest('.audit-photo');if(!i)return;$('lightboxImg').src=i.dataset.full||i.src;$('lightbox').classList.add('open')});$('closeLightbox').onclick=()=>$('lightbox').classList.remove('open');$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').classList.remove('open')};
function applyPhotos(){$('tableWrap').classList.toggle('hide-photos',!photosVisible);$('photosBtn').textContent=photosVisible?'Hide Photos':'Show Photos'}$('photosBtn').onclick=()=>{photosVisible=!photosVisible;localStorage.setItem('finance_portal_photos',photosVisible?'1':'0');applyPhotos()};$('apply').onclick=loadTrips;$('refreshBtn').onclick=loadTrips;$('clear').onclick=()=>{$('engineer').value='';$('driver').value='';$('project').value='';$('month').value='';loadTrips()};
(async()=>{if(managementToken){$('name').value=managementName;try{await post('financeFilterOptions');setAuthed(true)}catch(e){managementToken='';managementName='';sessionStorage.removeItem('tmx_km_finance_token');sessionStorage.removeItem('tmx_km_finance_name');setAuthed(false)}}else setAuthed(false)})();
</script></body></html>
